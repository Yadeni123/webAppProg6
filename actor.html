<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actor Guessing Game</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

    <div class="container bg-white p-4 rounded shadow-sm" style="max-width: 600px;">
        <h2 class="mb-4 text-primary">Actors by Yadeni Eba</h2>

        <form class="mb-3">
            <div class="mb-3">
                <label for="actor_name" class="form-label">Enter the secret actor name:</label>
                <input type="password" id="actor_name" class="form-control" value="Rihanna">
            </div>

            <div class="mb-3">
                <label for="guess" class="form-label">Guess the actor:</label>
                <input type="text" id="guess" class="form-control">
            </div>

            <input type="button" id="checkBtn" value="Check the guess" class="btn btn-primary" onclick="checkActor()">
        </form>

        <div id="result" class="alert alert-info" role="alert">
            Correct: 0 | Wrong: 0
        </div>
    </div>

    <script>
        var use_star = 0;
        var correct = 0;
        var wrong = 0;

        function checkActor() {
            let secret = document.getElementById("actor_name").value;
            let guessVal = document.getElementById("guess").value;

            if (guessVal === secret) {
                correct++;
                alert("You got it right!");
            } else {
                wrong++;
                alert("Wrong guess!");
            }

            document.getElementById("result").innerHTML = `Correct: ${correct} | Wrong: ${wrong}`;

            if (wrong > 10) {
                document.getElementById("checkBtn").onclick = tooManyGuesses;
            }
        }

        function tooManyGuesses() {
            alert("Sorry, too many wrong guesses.");
        }
    </script>
</body>
</html>
